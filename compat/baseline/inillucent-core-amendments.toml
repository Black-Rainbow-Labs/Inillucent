path = "crates/inillucent-core/src/distance.rs"
ticket = "task-2006"
reason = "task-2000 design 9: an explicit AVX2 and FMA dot product with eight 256-bit accumulators, selected once through is_x86_feature_detected! and falling back to the scalar loop. The release profile sets no target-cpu, because a published binary has to run on the processors people have, so the auto-vectorised four accumulator loop compiled to 128-bit lanes. It does not produce bit-identical answers and cannot - a different number of accumulators is a different summation order - and the measured worst absolute disagreement over ten thousand random L2 normalised pairs at 768 dimensions is 5.4e-8, under half a unit in the last place of an f32 near 1.0. Vector search p50 went 0.934 ms to 0.7974."
