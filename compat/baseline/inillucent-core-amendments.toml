reason = "task-2000: a fresh grade against PostgreSQL with pgvector on the synthetic corpus, the protocol task-1935 published, published to both files. Re-run at the commit the documents publish, so the card and the pages are one run. The build is 16.8 s from 129.7, vector search p50 0.8462 ms from 0.934 - which is short of the TDD asking for 0.65 - and the ranking verdicts are what they were: 15 better, 1 equivalent, 1 inconclusive, 0 worse, every correctness gate passing. Latency does not reproduce between runs and is not expected to: it is wall clock against a live PostgreSQL and both engines moved by tenths of a millisecond between the 09-19 and 09-20 sittings. The ranking families reproduce to four decimal places."
