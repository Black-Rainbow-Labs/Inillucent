org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Which Android ABIs to build, comma separated. The default is every ABI a phone ships with.
# run-tests.sh passes -PinillucentAbis=x86_64, the emulator's, so a test run builds one.
inillucentAbis=arm64-v8a,armeabi-v7a,x86_64
