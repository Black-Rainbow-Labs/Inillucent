[package]
name = "inillucent-pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Buffer pool: frames, version latches, pointer swizzling, cooling FIFO, writeback, free map, blob extents"

[dependencies]
inillucent-base = { workspace = true }
inillucent-vfs = { workspace = true }

[dev-dependencies]
inillucent-sim = { workspace = true }
# `ScratchDir`, the folder guard every test that makes a folder in the system
# temporary directory goes through, so a test removes what it made.
inillucent-base = { workspace = true, features = ["testing"] }

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
