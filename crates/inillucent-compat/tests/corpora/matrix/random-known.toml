# Differences a Layer 4 random case shows that are recorded defects, matched by
# construct because a random case id changes whenever the generator does.
# Same format as deliberate.toml; every rule names its bug number on the board
# in its name, and its reason says which bug. A rule here is a defect, never a
# deliberate difference: those go in deliberate.toml.

# A random case that differs from SQLite fails until it is fixed or a rule for its
# new bug is added here.

[[rule]]
name = "bug-83-a-failing-term-is-tested-before-the-join-equality"
contains = ["JOIN", "abs("]
detail = "integer overflow"
kinds = ["outcome"]
reason = "Bug 83 on task-2136. `abs()` of the smallest integer fails with integer overflow. SQLite reaches the WHERE term only for rows its join equality matched, through an automatic index, so a row the equality rejects never evaluates it; inillucent's nested loop tests the WHERE term on every pair first and fails. Found by the nightly random matrix on seed 20261006, case random-da72cd29323c."
