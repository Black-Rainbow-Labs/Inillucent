[package]
name = "inillucent-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never published. The deterministic simulator: a VFS that injects faults and
# replays crashes, which is a thing to test an engine with rather than to ship
# beside one.
publish = false
repository.workspace = true
description = "Deterministic simulator VFS, failure injection, crash modelling, and replay artifacts."

[dependencies]
inillucent-base = { workspace = true }
inillucent-vfs = { workspace = true }

[dev-dependencies]
# `ScratchDir`, the folder guard every test that makes a folder in the system
# temporary directory goes through, so a test removes what it made.
inillucent-base = { workspace = true, features = ["testing"] }

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
