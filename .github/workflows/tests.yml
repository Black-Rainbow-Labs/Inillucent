# The suite, run by something other than a person remembering to type a command.
#
# Until this file, nothing ran the tests except somebody on one Windows machine.
# The release script published to twelve destinations without running one, the
# binding conformance suite skipped on any machine that had not run five
# commands by hand, twelve fuzz targets existed and nothing started them, and
# four of the fifteen release blockers task-2066 found had a test that was
# written in a way that could not fail. A suite has every mechanism it needs and
# is driven by nobody.
#
# ## The Linux job is the first time this has run anywhere but that machine
#
# Every `requires` row in `tests/selection.toml` was written from what one
# Windows box happens to have. The first Linux run is expected to name targets
# that are Windows only, and each one gets a `requires` row with its reason or a
# fix - never an unconditional skip, which is the failure the whole `--strict`
# design exists to prevent.
#
# ## The runner's exit code is this job's exit code, and 2 is not a failure
#
# `inillucent-testrun` answers three codes (task-2047):
#
#   0  every selected target ran and passed
#   1  the run happened and was red
#   2  the run did NOT happen - the build failed, or cargo could not say what it
#      had built. Nothing was graded
#
# A `2` fails the job, because a release cannot be cut on it either, but it is
# reported as a run that did not happen rather than as a failing test. They need
# different things done about them, and an agent read one as the other once
# already, at the cost of 60 KB of log.
#
# ## Why --strict
#
# Several suites report success when a prerequisite is absent. That is correct
# for a fresh clone and useless as evidence, so `--strict` counts them and names
# them. A CI job without it would go green on a machine that built nothing.
#
# ## Which tiers run here, and which run in nightly.yml
#
# Every tier in `tests/selection.toml` has a cadence: `change`, `merge` or
# `nightly`. This workflow runs the `merge` cadence, which is every tier except
# `nightly`. The nightly tier (a ledger day of 100,000 transactions, every
# released format read back, a large table story) was 7,348 s of processor time
# and ran on every push until the cadence existed. It now runs once a day in
# `nightly.yml`.
#
# ## Once a night, and only on the public repository
#
# The suite runs on a schedule and when started by hand, never on a push. It
# runs only in Black-Rainbow-Labs/Inillucent, the public mirror, where GitHub
# gives every job four cores at no charge. In jasonmcaffee/inillucent, which is
# private, each push cost about seven runner hours on two cores, and on
# 2026-10-02 the account's Actions spending stopped every job there. The
# workflows are disabled in that repository, and the `if:` on the job below
# keeps them from running there even if somebody turns them back on.
#
# `ship.ps1` starts this workflow by hand on the mirror after a release, through
# `packaging/ci-status.ps1`, and the release is not finished until it passes.
# The mirror changes only at a release, so the nightly run grades the code that
# was last published.

name: tests

on:
  schedule:
    # 03:00 UTC, beside nightly.yml.
    - cron: "0 3 * * *"
  workflow_dispatch:

# A second push to the same branch cancels the first. The suite takes tens of
# minutes, so without this a branch pushed to three times holds three runners.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A hosted runner is a machine nobody is sitting at, so the test runner and
  # the release scripts take all of it rather than the 80% they leave free on
  # the development machine (task-2205).
  INILLUCENT_CPU_PERCENT: 100
  # A backtrace on the one test that failed, rather than a name and nothing.
  RUST_BACKTRACE: 1
  # A runner has a network, so the HTTP client's test fetches the real files
  # the installer fetches instead of skipping.
  INILLUCENT_NETWORK_TESTS: 1
  # With full debug information the suite came to 126 GB on Linux, and the
  # first Linux run stopped with "No space left on device". The workspace's
  # `[profile.dev]` now keeps line tables only, which `profile.test` inherits,
  # so a backtrace still has its file and line.
  CARGO_INCREMENTAL: 0

jobs:
  suite:
    name: ${{ matrix.os }}, share ${{ matrix.shard }}
    if: github.repository == 'Black-Rainbow-Labs/Inillucent'
    runs-on: ${{ matrix.os }}
    # The oracle build, the fixtures and a share of the change and merge tier
    # targets. The default 360 would hide a suite that started taking twice as
    # long.
    #
    # ## Why the suite is split into shares
    #
    # On 2026-10-02 one job per system ran out its 150 minutes: Linux had run
    # 143 of 356 targets and Windows 45. The statement matrix tiers, added after
    # the last run that finished, are most of the difference. The private
    # repository's runners have two cores, and measured against
    # `tests/timings.toml` the suite needs about 145 minutes of them on Linux and
    # 225 on Windows. `inillucent-testrun --shard <k>/<n>` gives each job a share
    # balanced by those times, so Linux runs three jobs and Windows four, each
    # about 50 to 60 minutes of suite. fmt, clippy and the contract tests do not
    # depend on the share, so only the first share of each system runs them.
    timeout-minutes: 150
    strategy:
      # Both operating systems always run. `fail-fast` would cancel Linux the
      # moment Windows went red, and "does it work on Linux" is the question
      # this job was added to answer.
      fail-fast: false
      # `absent` is the prerequisites a runner cannot have, passed to the suite
      # as `--absent`. A suite that skips for one of them is printed under its
      # own heading and does not fail the job; a suite that skips for anything
      # else still does. Each name is here for a reason:
      #
      #   onnx, embed       the embedding models are hundreds of megabytes and
      #                     are fetched by `inillucent setup-embeddings`, which
      #                     no step here runs. `embed` is the same model, asked
      #                     for by the suites that drive the `inillucent`
      #                     program built with its `embed` feature
      #   reranker          the 600 MB reranker, fetched by `inillucent
      #                     setup-embeddings reranker`, which no step here runs
      #   cuda              a hosted runner has no graphics card
      #   nikaya            the Nikaya checkout is a private repository
      #   previous-release  the released binaries `build-interop-fixture.ps1`
      #                     downloads are not fetched here
      #   postgres, mysql   Windows only: a Windows runner cannot start the
      #                     Linux containers the Linux job uses for them
      matrix:
        include:
          - os: windows-latest
            shard: 1/4
            first: true
            absent: --absent onnx --absent embed --absent reranker --absent cuda --absent nikaya --absent previous-release --absent postgres --absent mysql
          - os: windows-latest
            shard: 2/4
            first: false
            absent: --absent onnx --absent embed --absent reranker --absent cuda --absent nikaya --absent previous-release --absent postgres --absent mysql
          - os: windows-latest
            shard: 3/4
            first: false
            absent: --absent onnx --absent embed --absent reranker --absent cuda --absent nikaya --absent previous-release --absent postgres --absent mysql
          - os: windows-latest
            shard: 4/4
            first: false
            absent: --absent onnx --absent embed --absent reranker --absent cuda --absent nikaya --absent previous-release --absent postgres --absent mysql
          - os: ubuntu-latest
            shard: 1/3
            first: true
            absent: --absent onnx --absent embed --absent reranker --absent cuda --absent nikaya --absent previous-release
          - os: ubuntu-latest
            shard: 2/3
            first: false
            absent: --absent onnx --absent embed --absent reranker --absent cuda --absent nikaya --absent previous-release
          - os: ubuntu-latest
            shard: 3/3
            first: false
            absent: --absent onnx --absent embed --absent reranker --absent cuda --absent nikaya --absent previous-release

    steps:
      # A Linux runner starts with about 20 GB free, and the suite needs more
      # than that even with line tables only. These are SDKs the image ships
      # and nothing here uses: .NET, Android, Haskell, CodeQL and the cached
      # tool versions. Removing them frees about 30 GB.
      - name: free disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          df -h /

      # The whole history, so a pull request can ask what changed against its
      # base branch. A shallow clone has no base to compare with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The toolchain is pinned in `rust-toolchain.toml` and rustup honours it,
      # so nothing here names a version. A new compiler brings new lints, and
      # the strict lint run below is a required check.
      - name: toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          # The oracle and the fixtures are not cargo's, and they are what makes
          # a cold run twenty minutes longer than a warm one.
          cache-directories: |
            .sqlite-ref
            _agent_output/fixtures

      # `.sqlite-ref/` is gitignored - it is a downloaded amalgamation compiled
      # here, and no inillucent crate links it. Every download is checked
      # against the SHA3-256 sum SQLite publishes, using inillucent's own
      # implementation, so a substituted archive cannot become the thing every
      # parity claim is measured against.
      #
      # The script is run through `bash` rather than by its path. Every `.sh` in
      # this repository was committed from Windows without the executable bit,
      # so on Linux `tools/sqlite-reference.sh` answered "Permission denied"
      # and exit 126, and no Linux run of this job ever got past this step.
      - name: the pinned SQLite 3.53.4 oracle
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh tools/sqlite-reference.ps1
          else
            bash tools/sqlite-reference.sh
          fi

      # 1.2 MB, 17 MB and 94 MB, written by the pinned SQLite shell so that both
      # arms of a comparison start from a file SQLite itself wrote. Without them
      # `gates_fail_closed` and `new_engine_log_lead` skip, and `--strict` names
      # them - which is the right answer and not one to leave standing in CI.
      - name: the gate fixtures
        shell: bash
        run: bash tools/build-gate-fixtures.sh

      # The two live migration suites need a running server loaded from their
      # fixture file. `docker run` rather than a `services:` block, because a
      # `services:` block fails the Windows job outright. The clients are the
      # ones inside each image, so the fixture rows are written by `psql` and
      # `mysql` themselves, which is what makes them the oracle.
      - name: PostgreSQL and MySQL for the live migration suites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$PWD/crates/inillucent-remote/tests/fixtures:/fixtures:ro" postgres:17
          docker run -d --name my -p 3306:3306 -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            -v "$PWD/crates/inillucent-remote/tests/fixtures:/fixtures:ro" mysql:8.4
          for i in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          for i in $(seq 1 90); do
            docker exec my mysql -h 127.0.0.1 -u root -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec pg psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres \
            -c "CREATE DATABASE inillucent_migrate_test"
          docker exec pg psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres \
            -d inillucent_migrate_test -f /fixtures/postgres.sql
          docker exec my mysql -h 127.0.0.1 -u root \
            -e "CREATE DATABASE inillucent_migrate_test"
          docker exec my sh -c "mysql -h 127.0.0.1 -u root inillucent_migrate_test < /fixtures/mysql.sql"
          echo "INILLUCENT_TEST_POSTGRES_URL=postgres://postgres@127.0.0.1:5432/inillucent_migrate_test" >> "$GITHUB_ENV"
          echo "INILLUCENT_TEST_MYSQL_URL=mysql://root@127.0.0.1:3306/inillucent_migrate_test" >> "$GITHUB_ENV"

      - name: cargo fmt
        if: matrix.first
        run: cargo fmt --all --check

      # `--all-targets --all-features`, because a lint that only runs on the
      # default feature set does not see the `onnx` and `embed` code. The
      # governed crates' `deny(missing_docs)` and their ban on `unwrap`,
      # `expect`, `panic!` and slice indexing are crate attributes, so they are
      # enforced by this compile rather than by a list here - `tools/validate`
      # was the only thing that ever evaluated them.
      - name: cargo clippy
        if: matrix.first
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # Only the runner. It is behind `required-features = ["testrun"]`, so a
      # plain `cargo test` does not produce it. The test targets are built by
      # the runner's own build step below, which is the one that knows which
      # features each row asks for.
      - name: build the runner
        run: cargo build -p inillucent-compat --bin inillucent-testrun --features testrun

      # The contract tests first and by name. They are seconds, and each one
      # fails on a thing the rest of the run would fail on confusingly: a
      # dependency that may not be linked, a crate depending on one it may not,
      # a test target with no row in the map, a command in the table and not in
      # MCP, a workflow that is not YAML or a prerequisite CI does not answer.
      #
      # The command is quoted because `policy:: selection::` unquoted is a YAML
      # mapping, not a string. That line stopped this file parsing from
      # 2026-09-24, and every push run failed with no job until it was quoted.
      - name: the contracts
        if: matrix.first
        run: 'cargo test -p inillucent-compat --test tooling -- policy:: selection:: command_parity:: documentation:: ci_workflows::'

      # The merge cadence: every tier but `nightly` on a push, and what the
      # change can break on a pull request. The runner's own exit code is read
      # rather than the shell's: `$?` after a pipeline is the last command's
      # status, which is how a run that went red was once reported as a pass.
      - name: the suite
        shell: bash
        run: |
          set +e
          if [ "${{ runner.os }}" = "Windows" ]; then
            RUNNER=target/debug/inillucent-testrun.exe
          else
            RUNNER=target/debug/inillucent-testrun
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            "$RUNNER" --changed "origin/${{ github.base_ref }}" --cadence merge --strict --shard ${{ matrix.shard }} ${{ matrix.absent }}
          else
            "$RUNNER" --cadence merge --strict --shard ${{ matrix.shard }} ${{ matrix.absent }}
          fi
          code=$?
          echo "inillucent-testrun exited $code"
          case "$code" in
            0)
              echo "::notice::every selected target ran and passed"
              ;;
            1)
              echo "::error::the run happened and was red - a target failed, or --strict named a suite whose prerequisite was absent"
              ;;
            2)
              echo "::error::THE RUN DID NOT HAPPEN. The build failed, a named selection matched nothing, or cargo could not say what it had built. Nothing was graded, so nothing above may be read as a pass - this is not a failing test and should not be investigated as one."
              ;;
            *)
              echo "::error::inillucent-testrun answered $code, which is not one of its three exit codes"
              ;;
          esac
          exit $code

      # The schedules are written by the campaigns that produce them, and a diff
      # on one is a change in what the engine does under failure. A run that
      # leaves the tree dirty has either changed that, which a reviewer must
      # see, or has reintroduced the line-ending churn `.gitattributes` and
      # `crash_reports.rs` exist to stop.
      - name: the tree is clean after a run
        if: always()
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the run left the working tree dirty:"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
          echo "the run changed nothing that is tracked"
